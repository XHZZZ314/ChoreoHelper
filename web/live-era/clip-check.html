<!DOCTYPE html>
<!--
  clip-check.html — 动作条交互优化（把手/死区/气泡/自动补齐/键盘微调）可重复验证页
  干什么：iframe 载真实编舞主页，用合成鼠标/键盘事件驱动真实 renderClip/dragClip 验证：
    ① 把手存在：宽条有左右把手，窄条只有右把手
    ② 右把手拉长：只改时长不动起点；拖动中实时气泡出现
    ③ 点击死区：位移 2px 零改动
    ④ 拖动移动：条身拖动改起点；拖出空隙后前一条【不】被自动延长
    ⑤ 拉左缘缩短：本条改，前一条【不】被自动延长（主人抱怨的根子）
    ⑥ 删除后留缝：前一条保持不变
    ⑦ 插入中间：只把新插入的条延长接住下一个（A 不动）
    ⑧ 全量补齐（右键菜单同款调用）
    ⑨ 键盘微调：→ 移动 +0.5s，Shift+→ 时长 +0.5s
    ⑩ 吸附参考线：未吸附隐藏、吸附命中出现、松手隐藏
  WP-3b（编辑基础）新增：
    ⑪ 多选：Ctrl+点击加选/去选、Ctrl+A 全选、Esc 清空
    ⑫ 框选：空白处拖矩形选中碰到的条（未覆盖的不选）
    ⑬ 复制/粘贴：新 id、相对间距保持、粘贴条选中
    ⑭ 对齐到播放头：选中条起点统一=播放头
    ⑮ 插入/删除时间（prompt 打桩）：右移/ripple 左移
    ⑯ A-B 循环：区间外起播拉回 A、到 B 回卷（加速播放实测）
    ⑰ 段落标记：加标记进 store/标尺旗标/projectRecord、可撤销
    ⑱ 独奏/静音：S/M 切换、静音轨调暗、payload 过滤、S/M 互斥
    ⑲ 粘贴/复制腾位：横跨播放头的截断、后方整体右移、同轨零重叠
  FIX-2（数据完整性，2026-08-29）新增：
    ⑳ DOM 注入防护（AUD-002）：动作名/歌词/标记/舞者名注入 img/svg 不生成节点、文本原样显示、
       哨兵不触发、零额外请求；导入层校验（超长/空 dancers/非数字时刻中文拒绝，正常工程照常导入）
    ㉑ 撤销落盘 + 删除防复活（AUD-005/006）：undo/redo 后镜像立即=恢复后状态、showLyricMacro
       跟撤销走；删当前项目先切走再删、自动保存不复活被删项目（全程用测试自建项目，不碰原项目）
  FIX-3（时间轴正确性，2026-08-29）新增：
    ㉒ 显式套装边界（AUD-010 修订）：addClip 不自动生成切职业条、currentJob 不自动改写；手工切换轨受保护
       前条整体 +0.5 顺延、0 秒起点让位；真实 ChoreoCheck 体检零自造红项
    ㉓ 快速录制清单（AUD-014）：草稿引用、不在 REC_QUICK 的动作进快速清单（新 data.command
       与旧 command 结构都识别且去重）
  FIX-4 实时体检（2026-08-29）新增：
    ㉔ 红/黄描边高亮：重叠两条都 issue-red、缺录动作 issue-yellow、错开后描边清掉
    ㉕ 拖动局部刷新（OPT-2/AUD-019）：拖动 6 步期间完整 render 不增长、被拖条 left 实时变、mouseup 才整页重建
       （经 __checkRun 驱动 applyCheckIssues→render 的真实同步链路）
  FIX-H（第三审计 P2 网页修复，2026-08-30）新增：
    ㉖ 窄屏侧栏（AUD3-W1）：普通重绘后侧栏不丢 open、遮罩不卡、☰ 一次能关
    ㉗ 标签列宽（AUD3-W2）：LABEL_W 与 .lane-label 实宽一致（普通112/窄屏64），点条视觉左缘恰好 seek 到起点
    ㉘ Delete 键（AUD3-W3）：孤儿选中（条仍 selected=true 但 selectedClip=null）也能删掉
    ㉙ 体检在线骨架比对走 48795（原 apiFetch 走 48794 必 404，规则从未生效）（AUD3-W4）
  WEB-RACE（控制器竞态，2026-08-31）新增：
    ㉚ 宏 600ms 防抖期间切 tab：旧定时器只写回原舞者，不得覆盖新 tab 舞者
    ㉛ seek 409 重试只属于最新 seek：排队里的新时间不被旧时间借重试压过
    ㉜ 拖动中 800ms 实时体检让路（不整页重绘、DOM 不重建），收尾保留一次最终检查
    ㉝ 实测时长自动校正=时间轴变更：timelineRevision 递增并把新快照推给插件
    ㉞ 空区点击跳播放头在游戏模式下与标尺/标记一致地下发 seek
  两个坑（都踩过）：
    - 无头新 profile 没有草稿，等待条件不能依赖时间轴上已有 .clip；
    - 合成事件不能 mousedown/mousemove/mouseup 同步连发——dragClip 是 rAF 节流的，
      mouseup 会取消还没跑的 rAF 回调，拖动永远不生效。事件之间必须留真实延时。
  安全：测试会写 localStorage 草稿和项目库——开头备份（旧 choreo_draft 键 + 打开时的项目内容），
        结尾原样恢复（store、localStorage、项目库镜像/IDB 都还原）。
  结果写进正文与标题（CLIP-PASS / CLIP-FAIL:n）。
-->
<html lang="zh">
<head><meta charset="utf-8"><title>CLIP-CHECK</title>
<style>body{background:#111;color:#dfd;font:14px/1.8 monospace;margin:20px;white-space:pre-wrap}iframe{width:1100px;height:640px;border:1px solid #444;display:block;margin-top:10px}</style>
</head>
<body>
<div id="log">等待主页就绪…</div>
<iframe id="f" src="./choreo-helper-app.html"></iframe>
<script>
var logEl = document.getElementById('log');
var fails = 0, passes = 0;
function L(s){ logEl.textContent += '\n' + s; }
function ok(name, cond, detail){
  if (cond) { passes++; L('  ✔ ' + name + (detail ? '（' + detail + '）' : '')); }
  else { fails++; L('  ✘ ' + name + (detail ? '（' + detail + '）' : '')); }
  document.title = 'CLIP|' + passes + '过' + fails + '败';
}
function finish(){ L('[完成] ' + passes + ' 项通过，' + fails + ' 项失败'); document.title = fails ? ('CLIP-FAIL:' + fails) : 'CLIP-PASS'; }
function tick(ms){ return new Promise(function(r){ setTimeout(r, ms || 70); }); }

(function wait(attempt){
  var w = document.getElementById('f').contentWindow;
  var s = w && w.store;
  var ready = s && s.appReady && w.document.querySelector('.act-list');
  if (!ready) { if (attempt > 100) { fails++; L('超时：主页未就绪'); finish(); return; } setTimeout(function(){wait(attempt+1);}, 300); return; }
  run(w, s);
})(0);

function mouse(w, target, type, x, y, extra){
  var init = {bubbles:true, cancelable:true, clientX:x, clientY:y, button:0};
  if (extra) for (var k in extra) init[k] = extra[k];
  target.dispatchEvent(new w.MouseEvent(type, init));
}
function center(w, elm){
  var r = elm.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2, r: r };
}
function putClip(w, name, start, dur){
  var c = { id: w.store.nextClipId++, start: start, duration: dur, data: { name: name, command: '/' + name, category: 'usual' } };
  w.store.dancers[0].actionClips.push(c);
  return c;
}
function clipsDOM(w){ return w.document.querySelectorAll('#lanes .action-lane .lane-body .clip'); }

async function run(w, s){
  var draftBak = w.localStorage.getItem('choreo_draft');
  var targetBak = w.localStorage.getItem('choreo_previewTarget');
  var ppsBak = s.pps;
  // WP-3（项目中心）：store 现在从项目记录加载——备份打开时的项目内容，结尾按它还原并回写项目库。
  // 不能再按 choreo_draft 还原：那只备份了迁移前的旧底子，真 profile 里会把新项目覆盖回旧内容
  var projBak = JSON.stringify({dancers:s.dancers, globalLyrics:s.globalLyrics, dancerCount:s.dancerCount, showLyricMacro:s.showLyricMacro, totalDuration:s.totalDuration, markers:s.markers||[]});
  var loopBak = {a:s.loopA, b:s.loopB}; s.loopA = s.loopB = null; // WP-3b：循环区间是会话态，测试前清零

  s.dancers = [w.makeDancer(0)];
  s.selectedClip = null; s.dancerCount = 1;
  var A = putClip(w, '甲', 0, 5), B = putClip(w, '乙', 5, 5);
  s.pps = 60; w.render();
  var cds = clipsDOM(w);

  L('== ① 把手存在性 ==');
  ok('渲染出 2 条动作条', cds.length === 2, '实际=' + cds.length);
  var hA = cds[0].querySelector('.c-rz-r'), hAl = cds[0].querySelector('.c-rz-l');
  ok('宽条(300px)有右把手', !!hA);
  ok('宽条(300px)有左把手', !!hAl);
  // P5 渲染窗口化后可见窗随视口宽走（本页 iframe 内约 0-11.3s）——短条放进可见窗内
  var N = putClip(w, '短', 10, 0.5); w.render();
  var cds2 = clipsDOM(w);
  var cn = cds2[cds2.length - 1];
  ok('窄条(30px)只有右把手', !!cn.querySelector('.c-rz-r') && !cn.querySelector('.c-rz-l'));
  w.deleteClip(N.id); w.render();
  cds = clipsDOM(w); hA = cds[0].querySelector('.c-rz-r');

  L('== ② 右把手拉长：只改时长不动起点 ==');
  var p0 = center(w, hA);
  mouse(w, hA, 'mousedown', p0.x, p0.y);
  await tick();
  mouse(w, w.document, 'mousemove', p0.x + 120, p0.y);
  await tick();
  var tipMid = w.document.getElementById('dragTip');
  ok('拖动中出现实时气泡', !!(tipMid && tipMid.style.display !== 'none' && tipMid.textContent.indexOf('时长') >= 0), tipMid ? tipMid.textContent : '无气泡');
  mouse(w, w.document, 'mouseup', p0.x + 120, p0.y);
  await tick();
  ok('A 时长 5→7', A.duration === 7, '实际=' + A.duration);
  ok('A 起点仍为 0', A.start === 0, '实际=' + A.start);
  ok('B 未被波及', B.start === 5 && B.duration === 5);
  ok('松手后气泡隐藏', !tipMid || tipMid.style.display === 'none');

  L('== ③ 点击死区：2px 抖动零改动 ==');
  var pB = center(w, cds[1]);
  mouse(w, cds[1], 'mousedown', pB.x, pB.y);
  await tick();
  mouse(w, w.document, 'mousemove', pB.x + 2, pB.y + 1);
  await tick();
  mouse(w, w.document, 'mouseup', pB.x + 2, pB.y + 1);
  await tick();
  ok('B 起点/时长不变', B.start === 5 && B.duration === 5, B.start + '/' + B.duration);

  L('== ④ 拖动移动：留缝不回填 ==');
  mouse(w, cds[1], 'mousedown', pB.x, pB.y);
  await tick();
  mouse(w, w.document, 'mousemove', pB.x + 180, pB.y);
  await tick();
  mouse(w, w.document, 'mouseup', pB.x + 180, pB.y);
  await tick();
  ok('B 起点 5→8', B.start === 8, '实际=' + B.start);
  ok('留缝后 A 不被自动延长（旧版会 5→8）', A.duration === 7, '实际=' + A.duration);

  L('== ⑤ 拉左缘缩短：前一条不被抢改 ==');
  w.render(); cds = clipsDOM(w);
  var hBl = cds[1].querySelector('.c-rz-l');
  ok('B(300px)有左把手', !!hBl);
  if (hBl) {
    var pL = center(w, hBl);
    mouse(w, hBl, 'mousedown', pL.x, pL.y);
    await tick();
    mouse(w, w.document, 'mousemove', pL.x + 60, pL.y);  // +60px @60pps = +1s → B 左缘 8→9
    await tick();
    mouse(w, w.document, 'mouseup', pL.x + 60, pL.y);
    await tick();
    ok('B 左缘 8→9 且时长缩短', B.start === 9 && B.duration === 4, B.start + '/' + B.duration);
    ok('A 保持 7 不被延长（主人抱怨点）', A.duration === 7, '实际=' + A.duration);
  }

  L('== ⑥ 删除后留缝：前一条不变 ==');
  var dA = A.duration;
  w.deleteClip(B.id);
  ok('删除 B 后 A 不变', A.duration === dA, '实际=' + A.duration);

  L('== ⑦ 插入中间：只延长新条接住下一个 ==');
  s.dancers = [w.makeDancer(0)]; s.selectedClip = null;
  A = putClip(w, '甲', 0, 5); B = putClip(w, '乙', 10, 5);
  w.render();
  w.addClip(0, 'action', { name: '丙', command: '/bing', category: 'usual', duration: 2 }, 6);
  var C = s.dancers[0].actionClips.filter(function(c){ return c.data.name === '丙'; })[0];
  ok('新条落在 6s', C && C.start === 6, C && ('实际=' + C.start));
  ok('新条自动延长接住 B（2→4s）', C && C.duration === 4, C && ('实际=' + C.duration));
  ok('A 不被波及（保持 5）', A.duration === 5, '实际=' + A.duration);

  L('== ⑧ 全量补齐（右键菜单同款调用） ==');
  w.autoFillGaps(0);
  ok('A 延长到 6 接住丙', A.duration === 6, '实际=' + A.duration);
  ok('丙保持到 10', C.duration === 4 && (C.start + C.duration) === 10);

  L('== ⑨ 键盘微调 ==');
  s.selectedClip = C; C.selected = true; // 多选时代：平移走选集标志，单选也须置 selected
  w.document.dispatchEvent(new w.KeyboardEvent('keydown', { code: 'ArrowRight', bubbles: true }));
  ok('→ 起点 +0.5s', C.start === 6.5, '实际=' + C.start);
  w.document.dispatchEvent(new w.KeyboardEvent('keydown', { code: 'ArrowRight', shiftKey: true, bubbles: true }));
  ok('Shift+→ 时长 +0.5s', C.duration === 4.5, '实际=' + C.duration);

  L('== ⑩ 吸附参考线 ==');
  s.dancers = [w.makeDancer(0)]; s.selectedClip = null;
  A = putClip(w, '甲', 0, 5); B = putClip(w, '乙', 7, 5);
  s.pps = 60; w.render();
  cds = clipsDOM(w);
  var pB2 = center(w, cds[1]);
  mouse(w, cds[1], 'mousedown', pB2.x, pB2.y);
  await tick();
  mouse(w, w.document, 'mousemove', pB2.x - 60, pB2.y);   // 7→6，离 A.end=5 远，不吸附
  await tick();
  var g1 = w.document.getElementById('dragGuide');
  var hiddenWhenFar = !g1 || g1.style.display === 'none';
  mouse(w, w.document, 'mousemove', pB2.x - 108, pB2.y);  // 7→5.2，距 5 为 0.2<0.3 → 吸附到 5
  await tick();
  var g2 = w.document.getElementById('dragGuide');
  var shownOnSnap = !!(g2 && g2.style.display !== 'none');
  ok('未吸附时参考线隐藏', hiddenWhenFar);
  ok('吸附命中时参考线出现', shownOnSnap);
  mouse(w, w.document, 'mouseup', pB2.x - 108, pB2.y);
  await tick();
  ok('B 起点被吸到 A 末端 5', B.start === 5, '实际=' + B.start);
  ok('松手后参考线隐藏', !g2 || g2.style.display === 'none');

  L('== ⑪ 多选：Ctrl+点击 / Ctrl+A / Esc ==');
  s.dancers = [w.makeDancer(0)]; s.selectedClip = null;
  A = putClip(w, '甲', 0, 5); B = putClip(w, '乙', 7, 5);
  s.pps = 60; w.render();
  cds = clipsDOM(w); pA1 = center(w, cds[0]); pB1 = center(w, cds[1]);
  mouse(w, cds[0], 'mousedown', pA1.x, pA1.y, {ctrlKey:true});
  await tick();
  ok('Ctrl+点击 A：加选', A.selected === true && w.edSel().length === 1);
  cds = clipsDOM(w); pB1 = center(w, cds[1]); // Ctrl+点击后 render() 重建过 DOM，重新取节点
  mouse(w, cds[1], 'mousedown', pB1.x, pB1.y, {ctrlKey:true});
  await tick();
  ok('Ctrl+点击 B：两条都在选集', A.selected && B.selected && w.edSel().length === 2);
  cds = clipsDOM(w); pA1 = center(w, cds[0]);
  mouse(w, cds[0], 'mousedown', pA1.x, pA1.y, {ctrlKey:true});
  await tick();
  ok('再 Ctrl+点击 A：去选', A.selected === false && B.selected === true);
  w.document.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'a', ctrlKey: true, bubbles: true }));
  ok('Ctrl+A 全选', w.edSel().length === 2);
  w.document.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  ok('Esc 清空多选', w.edSel().length === 0 && w.store.selectedClip === null);

  L('== ⑫ 框选：空白处拖矩形 ==');
  cds = clipsDOM(w); pA1 = center(w, cds[0]); pB1 = center(w, cds[1]); // Esc 后重建过，重新取
  mouse(w, cds[0], 'mousedown', pA1.x, pA1.y, {ctrlKey:true}); // 先给 A 造"已选"底子，验证框选（非追加）会清掉它
  await tick();
  cds = clipsDOM(w); pB1 = center(w, cds[1]);
  var mqX = pB1.r.left - 20, mqY = pB1.r.top + pB1.r.height / 2; // B 左侧 20px = 轨道空白区
  mouse(w, w.document.querySelector('#lanes .action-lane .lane-body'), 'mousedown', mqX, mqY);
  await tick();
  mouse(w, w.document, 'mousemove', mqX + 30, mqY + 10); // 越过 3px 死区，进入框选
  await tick();
  mouse(w, w.document, 'mousemove', pB1.r.right + 30, mqY + 10);
  await tick();
  mouse(w, w.document, 'mouseup', pB1.r.right + 30, mqY + 10);
  await tick();
  ok('框选矩形覆盖 B：B 选中', B.selected === true);
  ok('A 在矩形外且非追加模式：A 不选', A.selected !== true);
  ok('框选后播放头没被带走（click 被吞）', s.currentTime === 0, '实际=' + s.currentTime);

  // 舞者标题行起拖也能框选（2026-08-29 第二轮反馈）
  var hdr0 = w.document.querySelector('#lanes .dancer-grp .d-hdr');
  var hr = hdr0.getBoundingClientRect();
  mouse(w, hdr0, 'mousedown', pB1.r.left - 20, hr.top + hr.height / 2); // 从 A 右侧上方的标题行起拖
  await tick();
  mouse(w, w.document, 'mousemove', pB1.r.right + 30, pB1.y);
  await tick();
  mouse(w, w.document, 'mouseup', pB1.r.right + 30, pB1.y);
  await tick();
  ok('舞者标题行起拖也能框选（B 选中、A 不选）', B.selected === true && A.selected !== true,
    'B=' + B.selected + ' A=' + A.selected);

  L('== ⑬ 复制 / 粘贴（紧贴选中条） ==');
  cds = clipsDOM(w); pA1 = center(w, cds[0]); // 框选后重建过，重新取
  mouse(w, cds[0], 'mousedown', pA1.x, pA1.y, {ctrlKey:true}); // Ctrl+点击 A 追加进选集（B 已选中）
  await tick();
  ok('选集就绪（A+B）', w.edSel().length === 2);
  w.copySelection();
  var before = s.dancers[0].actionClips.length;
  w.pasteSelection(); // 新语义：紧贴当前选中的 A（末端 5）之后；腾位把 B 推开
  var all = s.dancers[0].actionClips;
  var pasted = all.slice(before);
  ok('粘贴出 2 条新 clip', pasted.length === 2);
  ok('新 id 不与原件冲突', pasted.every(function(c){ return c.id !== A.id && c.id !== B.id; }));
  ok('紧贴选中的 A 之后（5 和 12，相对间距保持）', pasted[0].start === 5 && pasted[1].start === 12, pasted.map(function(c){return c.start}).join('/'));
  ok('腾位：原 B 右移 7→19', B.start === 19, '实际=' + B.start);
  ok('粘贴条自动选中', pasted.every(function(c){ return c.selected === true; }));

  L('== ⑭ 对齐到播放头 ==');
  s.dancers = [w.makeDancer(0)]; s.selectedClip = null;
  A = putClip(w, '甲', 1, 3); B = putClip(w, '乙', 8, 4);
  A.selected = true; B.selected = true; s.selectedClip = B;
  s.currentTime = 3; w.render();
  w.alignSelectionToPlayhead();
  ok('两条起点都对齐到播放头 3s（时长不变）', A.start === 3 && B.start === 3 && A.duration === 3 && B.duration === 4);

  L('== ⑮ 插入 / 删除时间（prompt 打桩） ==');
